[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-enrollment-dashboard-api"
version = "1.0.0"
description = "Data loader for the UC enrollment geography dashboard (boundaries and CSV extracts into Supabase)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[dependency-groups]
# Same set as the dev extra, for `uv sync`. Hosts that run `uv sync --no-dev` skip it.
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Fixtures build SQL and GeoPackages by hand; the long literals are clearer unwrapped.
"tests/conftest.py" = ["E501"]
